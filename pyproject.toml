[project]
name = "rolesail"
version = "1.0.0"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
gmail = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]

[project.scripts]
rolesail = "rolesail.cli:app"
applypilot = "rolesail.cli:app"

[project.urls]
Homepage = "https://github.com/IshavSohal/RoleSail"
Repository = "https://github.com/IshavSohal/RoleSail"
Issues = "https://github.com/IshavSohal/RoleSail/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolesail"]

[tool.hatch.build]
artifacts = [
    "src/rolesail/config/*.yaml",
    "src/rolesail/templates/*.tex",
    "src/rolesail/web_dist/**/*",
]

[tool.ruff]
target-version = "py311"
line-length = 120
